<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yibarek Tadesse, CS student building AI systems, ML research, data pipelines, and full-stack apps. LinkedIn: in/yibarek.">
  <defs>
    <clipPath id="frame"><rect width="1200" height="460" rx="14"/></clipPath>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="#ffffff"/>
    <rect x="1" y="1" width="1198" height="458" rx="13" fill="none" stroke="#d0d7de" stroke-width="2"/>

    <rect width="1200" height="40" fill="#f6f8fa"/>
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#d0d7de" stroke-width="1"/>
    <circle cx="30" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="54" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="78" cy="20" r="6" fill="#27c93f"/>
    <text x="600" y="27" font-size="20" fill="#57606a" text-anchor="middle">yibarek@github - zsh - 120x30</text>

    <text x="48" y="88" font-size="20"><tspan fill="#0f766e">$ </tspan><tspan fill="#1f2328">whoami</tspan></text>
    <text x="48" y="132" font-size="32" font-weight="700" fill="#0d1117">yibarek tadesse</text>
    <text x="48" y="180" font-size="20"><tspan fill="#0f766e">$ </tspan><tspan fill="#1f2328">cat about.md</tspan></text>
    <text x="48" y="210" font-size="30" fill="#57606a">
      <tspan x="48" dy="0">Hi, I'm Yibarek, a recent CS grad from the College of William &amp; Mary. I like building tools that</tspan>
      <tspan x="48" dy="30">create solutions, improve everyday life, or are just fun little knickknacks using the newest</tspan>
      <tspan x="48" dy="30">technologies. If you would, I'd love for you to take a look at some of the work I've done. Feel free</tspan>
      <tspan x="48" dy="30">to leave suggestions or let me know about any bugs you run into; I'd really appreciate it. If you'd</tspan>
      <tspan x="48" dy="30">like to get in touch, check me out on LinkedIn below!</tspan>
    </text>
    <text x="48" y="366" font-size="20"><tspan fill="#0f766e">$ </tspan><tspan fill="#1f2328">echo $LINKEDIN</tspan></text>
    <text x="48" y="394" font-size="20" fill="#0f766e" style="text-decoration:underline">linkedin.com/in/yibarek</text>
    <text x="48" y="430" font-size="20"><tspan fill="#0f766e">$ </tspan><tspan fill="#1f2328">_</tspan></text>
  </g>
</svg>
